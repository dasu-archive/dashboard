<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rehab 코드 품질 대시보드</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; font-weight: 600; }
    .meta { color: #777; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    td { padding: 10px; border-bottom: 1px solid #eee; }
    td:first-child { color: #555; width: 40%; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>rehab 코드 품질 대시보드</h1>
  <p class="meta" id="meta">데이터 불러오는 중...</p>
  <table id="summary"></table>

  <script>
    // 상대 경로로 읽어야 함: 이 사이트 주소는 /rehab/ 아래라서 "/data/..."로 쓰면 못 찾음
    fetch('data/latest.json', { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('data/latest.json 응답 ' + res.status);
        return res.json();
      })
      .then(d => {
        document.getElementById('meta').textContent =
          '생성 시각 ' + d.generatedAt + ' · 커밋 ' + d.commit;
        const rows = [
          ['품질 게이트', d.sonar.qualityGate],
          ['커버리지', d.sonar.coverage + '%'],
          ['버그', d.sonar.bugs],
          ['코드 스멜', d.sonar.codeSmells],
          ['Claude 리뷰 지적', d.claude.findings]
        ];
        document.getElementById('summary').innerHTML =
          rows.map(([k, v]) => '<tr><td>' + k + '</td><td>' + v + '</td></tr>').join('');
      })
      .catch(err => {
        const meta = document.getElementById('meta');
        meta.textContent = '데이터를 불러오지 못했어요: ' + err.message;
        meta.className = 'error';
      });
  </script>
</body>
</html>
